name: CI

# 与 DDDFXYqiming/loreweaver-red 的 .github/workflows/ci.yml 保持同一套规范：
# push(main) + pull_request 触发、同 ref 并发取消、最小只读权限。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} — install + offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 package.json 的 engines 对齐：^22.19.0 || >=24.0.0
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # 依赖全部来自公共 npm 上的精确版本（devDependencies / overrides 钉在
      # 0.1.6-alpha.1），不需要任何私有 registry、API key 或凭证。
      # pnpm install 会自动执行 prepare 钩子 = scripts/build.mjs（tsc 编译宿主 + 复制客户端）。
      # 仓库跟踪 pnpm-lock.yaml，CI 与本地开发走同一条安装链路：
      # --frozen-lockfile 把构建期依赖（schemastery / zod / typescript 等）钉在
      # lock 里的版本，lib/ 构建产物可复现，类型声明不会因依赖浮动而漂移。
      - name: Install
        run: pnpm install --frozen-lockfile
      # 这一步完全离线：self-check 是纯函数断言；node --test 的用例使用内存里的
      # 假 ctx / 假 LLM / 全局 fetch stub，不读取任何 API key、不调用真实模型、
      # 也不访问任何外部数据源。因此可以安全地放进 push/PR 流水线。
      - name: Test (offline)
        run: pnpm test
      - name: Typecheck
        run: pnpm run typecheck
      # lib/ 是提交进仓库的构建产物；重新构建后必须与提交内容一致，
      # 防止改了 src/ 却忘记提交编译产物。
      - name: Verify committed lib/ matches a fresh build
        run: |
          pnpm run build
          git status --porcelain -- lib
          test -z "$(git status --porcelain -- lib)"
